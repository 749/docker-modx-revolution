name: Docker Build

on:
  workflow_dispatch:
  push:
    # Publish 'main' as Docker 'edge' image.
    branches:
      - main
    # Publish 'v1.2.3' tags as releases.
    tags:
      - v*
  # Run tests for any PRs.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  schedule:
    # run every Sunday at 00:00
    - cron: "0 0 * * 0"

env:
  IMAGE_REPO: g749/modx-revolution
  IMAGE_TITLE: modx-revolution
  IMAGE_DESCRIPTION: Autoupdating Docker container for ModX Revolution > 2.7.0

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select newest release in every MODX major line
        id: versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/plan_builds.py >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish-${{ matrix.major }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image metadata
        id: metadata
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          pull: true
          builder: ${{ steps.buildx.outputs.name }}
          context: build/
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ matrix.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:cache-${{ matrix.major }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:cache-{1},mode=max', env.IMAGE_REPO, matrix.major) || '' }}
          build-args: |
            SOURCE_VERSION=${{ matrix.version }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.vendor=g749
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.version }}
